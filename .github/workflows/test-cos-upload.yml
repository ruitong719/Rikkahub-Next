name: Test COS Upload

on:
  workflow_dispatch:

jobs:
  test_cos_upload:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 创建测试文件
        run: |
          mkdir -p test-output
          echo "RikkaHub COS Test - $(date)" > test-output/test.txt
          echo "Build: ${GITHUB_SHA}" >> test-output/test.txt

      - name: 检查 Secrets
        run: |
          echo "COS_SECRET_ID length: ${#COS_SECRET_ID}"
          echo "COS_SECRET_KEY length: ${#COS_SECRET_KEY}"
          echo "COS_BUCKET: ${COS_BUCKET}"
          echo "COS_REGION: ${COS_REGION}"
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-guangzhou

      - name: 安装 Python COS SDK
        run: pip install cos-python-sdk-v5

      - name: 上传到 COS
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ap-guangzhou
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          from qcloud_cos import CosConfig, CosS3Client

          secret_id = os.getenv("COS_SECRET_ID")
          secret_key = os.getenv("COS_SECRET_KEY")
          bucket = os.getenv("COS_BUCKET")
          region = os.getenv("COS_REGION", "ap-guangzhou")

          print(f"SecretId length: {len(secret_id) if secret_id else 0}")
          print(f"SecretKey length: {len(secret_key) if secret_key else 0}")
          print(f"Bucket: {bucket}")
          print(f"Region: {region}")

          if not secret_id or not secret_key:
              print("ERROR: SecretId or SecretKey is empty!")
              exit(1)

          config = CosConfig(Region=region, SecretId=secret_id, SecretKey=secret_key, Scheme="https")
          client = CosS3Client(config)

          key = f"ci-test/{os.getenv('GITHUB_SHA')[:7]}.txt"
          print(f"Uploading to: {key}")

          response = client.upload_file(
              Bucket=bucket,
              LocalFilePath="test-output/test.txt",
              Key=key,
              PartSize=10,
              MAXThread=10,
              EnableMD5=False
          )
          print(f"Upload Success! ETag: {response.get('ETag')}")

          head = client.head_object(Bucket=bucket, Key=key)
          print(f"File size: {head.get('Content-Length')} bytes")
          PYTHON_SCRIPT
